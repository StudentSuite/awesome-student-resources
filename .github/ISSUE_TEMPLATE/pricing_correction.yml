name: Report a wrong pricing tag
description: An entry's free / freemium / paid / open source tag is out of date or wrong
labels: ["pricing-review", "quality"]
body:
  - type: input
    id: entry
    attributes:
      label: Entry name
      description: The exact name of the entry as it appears in the README
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: Section
      description: Which section of the README it's in
    validations:
      required: true
  - type: dropdown
    id: current_tag
    attributes:
      label: Current tag
      description: What the entry says today
      options:
        - free
        - freemium
        - paid
        - open source
        - no tag at all
    validations:
      required: true
  - type: dropdown
    id: correct_tag
    attributes:
      label: Correct tag
      description: What it should say instead
      options:
        - free
        - freemium
        - paid
        - open source
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: How do you know?
      description: A link to the pricing page, or what you saw when you signed up. Screenshots are fine.
    validations:
      required: true
